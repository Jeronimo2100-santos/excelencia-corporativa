name: Compilar Livro PDF

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Permite rodar manualmente na aba Actions

permissions:
  contents: read
  actions: write

jobs:
  compilar:
    name: Compilar LaTeX → PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # 1. Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2. Instalar TeX Live (completo) + biber + latexmk
      - name: Instalar TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          root_file: 04-producao/livro-abntex2.tex
          working_directory: 04-producao
          latexmk_use_lualatex: false
          latexmk_use_xelatex: false
          latexmk_use_pdflatex: true
          extra_packages: |
            biber
            latexmk
            pandoc
            python3
            make
            zip
            git
      
      # 3. Instalar pandoc (para converter .md → .tex)
      - name: Instalar Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
      
      # 4. Converter capítulos .md → .tex
      - name: Converter capítulos Markdown → LaTeX
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p 03-capitulos-tex
          for f in 03-capitulos/*.md; do
            nome=$(basename "$f" .md)
            echo "Convertendo: $nome"
            pandoc "$f" -o "03-capitulos-tex/$nome.tex" \
              --from markdown \
              --to latex \
              --standalone \
              --wrap=none \
              2>/dev/null || echo "Aviso: falha ao converter $nome"
          done
          echo "Convertidos: $(ls 03-capitulos-tex/*.tex | wc -l) arquivos"
      
      # 5. Compilar figuras TikZ (standalone)
      - name: Compilar figuras TikZ
        working-directory: ${{ github.workspace }}/04-producao
        run: |
          for cap_dir in figuras/cap*/; do
            if [ -d "$cap_dir" ]; then
              for tikz_file in "$cap_dir"/*.tikz; do
                if [ -f "$tikz_file" ]; then
                  filename=$(basename "$tikz_file" .tikz)
                  echo "Compilando figura: $filename"
                  cd "$cap_dir"
                  pdflatex -shell-escape -interaction=nonstopmode -halt-on-error "$filename.tikz" > /dev/null 2>&1 || echo "Aviso: falha ao compilar $filename"
                  cd - > /dev/null
                fi
              done
            fi
          done
      
      # 6. Compilar PDF principal (latexmk: pdflatex → biber → pdflatex ×2)
      - name: Compilar PDF (latexmk)
        working-directory: ${{ github.workspace }}/04-producao
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -shell-escape livro-abntex2.tex
      
      # 7. Verificar PDF gerado
      - name: Verificar PDF gerado
        working-directory: ${{ github.workspace }}/04-producao
        run: |
          if [ -f "livro-abntex2.pdf" ]; then
            pages=$(pdfinfo livro-abntex2.pdf 2>/dev/null | grep Pages | awk '{print $2}')
            size=$(ls -lh livro-abntex2.pdf | awk '{print $5}')
            echo "✅ PDF gerado: $pages páginas, $size"
            echo "PDF_PATH=04-producao/livro-abntex2.pdf" >> $GITHUB_ENV
          else
            echo "❌ PDF NÃO ENCONTRADO"
            exit 1
          fi
      
      # 8. Upload do PDF como Artifact
      - name: Upload PDF (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Excelencia_Corporativa_PDF
          path: 04-producao/livro-abntex2.pdf
          retention-days: 30
          compression-level: 6
      
      # 9. (Opcional) Gerar DOCX via pandoc
      - name: Gerar DOCX (opcional)
        if: success()
        working-directory: ${{ github.workspace }}/04-producao
        run: |
          if command -v pandoc >/dev/null; then
            pandoc livro-abntex2.tex -o livro-abntex2.docx --from latex --to docx 2>/dev/null || true
            if [ -f "livro-abntex2.docx" ]; then
              echo "DOCX gerado"
            fi
          fi
      
      - name: Upload DOCX (se gerado)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Excelencia_Corporativa_DOCX
          path: 04-producao/livro-abntex2.docx
          retention-days: 30
          compression-level: 6
          if-no-files-found: ignore